services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./qrcodes:/app/qrcodes
      # On-demand dumps from GET /backup land next to the scheduled ones, so the
      # backup service's 14 day cleanup covers both.
      - ./backups:/app/backups
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mundra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mundra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only: reachable from this machine (for `uv run` and pytest),
    # never from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dumps the database every 24 hours (first dump on start) into ./backups and
  # deletes dumps older than 14 days. Copy ./backups off the host as well.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-mundra}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-mundra}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump --format=custom --file=/backups/mundra-$$(date +%F).dump
          find /backups -name 'mundra-*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
